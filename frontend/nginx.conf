server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    # MCP server (only answers when MCP_ENABLED=true). The backend checks
    # Host against PUBLIC_URL, so pass the client's through; responses can
    # stream, so don't buffer them.
    location = /mcp {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # OAuth discovery documents for MCP clients.
    location /.well-known/oauth- {
        proxy_pass http://backend:8080;
    }

    # The OAuth consent page must never be framed (clickjacking an
    # "Approve" click would hand an app full access).
    location /oauth/ {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
