server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    # MCP server (only answers when MCP_ENABLED=true). The backend checks
    # Host against PUBLIC_URL, so pass the client's through; responses can
    # stream, so don't buffer them.
    location = /mcp {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
