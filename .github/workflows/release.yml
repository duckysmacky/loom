name: Release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-latest:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: loom-backend
            context: ./backend
            dockerfile: backend/Dockerfile
          - image: loom-frontend
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/duckysmacky/${{ matrix.image }}:latest

  build-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: loom-backend
            context: ./backend
            dockerfile: backend/Dockerfile
          - image: loom-frontend
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/duckysmacky/${{ matrix.image }}:${{ steps.version.outputs.version }}

  draft-release:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Write release notes template
        run: |
          cat <<EOF > release-notes.md
          # Release notes

          <!-- TODO: summarize what changed in this release -->

          ## Changelog
          
          <!-- TODO: fill the changelog -->

          ## Installation and running

          See README.md on how to install and run the application.

          ## Docker images

          You can pull the docker images for this release using the following commands:

          \`\`\`
          docker pull ghcr.io/duckysmacky/loom-backend:${{ steps.version.outputs.version }}
          docker pull ghcr.io/duckysmacky/loom-frontend:${{ steps.version.outputs.version }}
          \`\`\`
          EOF
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME - Release" --notes-file release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
