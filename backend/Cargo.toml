[package]
name = "loom"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18.2"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl"] }
uuid = { version = "1.26.1", features = ["v7", "serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
