services:
  app:
    build: .
    env_file: .env
    ports:
      # Bound to loopback: nginx (already on the host, per
      # docs/PROJECT_OVERVIEW.md) is the trusted party the rate limiter's
      # SmartIpKeyExtractor reads X-Forwarded-For/X-Real-IP from - nothing
      # else should be able to reach this port directly and spoof them.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
